name: Build K3765-Z probe kernel

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-k3765-probe.yml"
      - "kernel/**"
      - "work/build_linux_image_bl1.py"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Shadow-MSM
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install ARM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bc \
            bison \
            build-essential \
            device-tree-compiler \
            flex \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            python3-venv

      - name: Install Shadow-MSM Python build dependencies
        run: |
          python3 -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install --requirement requirements.txt

      - name: Fetch official Linux v6.1
        run: |
          git clone \
            --depth 1 \
            --branch v6.1 \
            https://github.com/torvalds/linux.git \
            linux-v6.1

      - name: Build and verify the RAM-only probe
        env:
          SHADOW_MSM_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          ./kernel/build-k3765-probe.sh \
            ./linux-v6.1 \
            ./build/k3765-probe

      - name: Upload verified probe artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shadow-msm-k3765-probe
          path: build/k3765-probe/artifacts/
          if-no-files-found: error
          retention-days: 30
