name: Build K3765-Z probe kernel

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-k3765-probe.yml"
      - "kernel/**"
      - "work/build_linux_image_bl1.py"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Shadow-MSM
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install ARM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bc \
            bison \
            build-essential \
            bzip2 \
            curl \
            device-tree-compiler \
            flex \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libc6-dev-armel-cross \
            libssl-dev \
            python3-venv

      - name: Install Shadow-MSM Python build dependencies
        run: |
          python3 -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install --requirement requirements.txt

      - name: Fetch official Linux v6.1
        run: |
          git clone \
            --depth 1 \
            --branch v6.1 \
            https://github.com/torvalds/linux.git \
            linux-v6.1

      - name: Fetch and verify official BusyBox 1.36.1
        run: |
          curl --fail --location --retry 3 \
            --output busybox-1.36.1.tar.bz2 \
            https://busybox.net/downloads/busybox-1.36.1.tar.bz2
          echo \
            "b8cc24c9574d809e7279c3be349795c5d5ceb6fdf19ca709f80cde50e47de314  busybox-1.36.1.tar.bz2" \
            | sha256sum --check --strict
          tar -xjf busybox-1.36.1.tar.bz2

      - name: Build and verify the RAM-only probe
        env:
          SHADOW_MSM_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          set +e
          ./kernel/build-k3765-probe.sh \
            ./linux-v6.1 \
            ./busybox-1.36.1 \
            ./build/k3765-probe \
            > build-k3765-probe.log 2>&1
          build_status=$?
          set -e
          cat build-k3765-probe.log
          if [[ ${build_status} -ne 0 ]]; then
            build_error="$(tail -n 35 build-k3765-probe.log)"
            build_error="${build_error//'%'/'%25'}"
            build_error="${build_error//$'\r'/'%0D'}"
            build_error="${build_error//$'\n'/'%0A'}"
            echo "::error title=Shadow-MSM verified build failed::${build_error}"
            exit "${build_status}"
          fi

      - name: Upload verified probe artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shadow-msm-k3765-probe
          path: build/k3765-probe/artifacts/
          if-no-files-found: error
          retention-days: 30
